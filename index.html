</style></head><body><main><div id="app"></div></main>

<script>
var KEY='lifelog.v1',ENC='lifelog.enc',tab='home',now=()=>new Date();
var loc=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
var DEF={entries:[],cur:'AED',profile:{company:'',position:''},people:[],car:[{n:'Car registration expiry',d:''},{n:'Car insurance expiry',d:''}],
acts:{'Eating':['Breakfast','Lunch','Dinner','Snacks','Tea','Leisure juice','Recreation eating','New tasting'],'Phone':['Screen time','Call','Message'],'Health':['Disease','Medicine','Doctor visit','Exercise'],'Work':['Meeting','Task','Travel'],'Leisure':['Movie','Outing','Gaming'],'Shopping':['Groceries','Fuel','Other'],'Income':['Salary','Bonus','Other credit'],'Bills':['Rent','Utilities','Car expense']}};
var S,CK=null,LOCKED=true,HZ=30;function norm(){S=S||JSON.parse(JSON.stringify(DEF));S.loans=S.loans||[];S.upcoming=S.upcoming||[];S.opening=S.opening||0;S.plans=S.plans||[];S.rem=S.rem||[];S.days=S.days||[];[['Life Events',['Marriage','Birth','Achievement','Milestone','Special day']],['Sleep',['Slept']],['Travel',['Journey','Trip']]].forEach(function(a){if(!S.acts[a[0]])S.acts[a[0]]=a[1]});}
var Q=Promise.resolve();function b64(u){u=new Uint8Array(u);var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function ub(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pw,s){var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function save(){if(!CK||!S)return;var d=JSON.stringify(S),c0=CK;Q=Q.then(async()=>{try{var iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},c0.k,new TextEncoder().encode(d));localStorage.setItem(ENC,JSON.stringify({s:c0.s,i:b64(iv),d:b64(c)}));localStorage.removeItem(KEY)}catch(e){}})}
async function unlock(){var g=i=>document.getElementById(i),pw=g('pw').value,er=g('lerr'),raw=null;try{raw=localStorage.getItem(ENC)}catch(x){}if(pw.length<4){er.textContent='Use at least 4 characters';return}
 try{if(raw){var o=JSON.parse(raw),k=await derive(pw,ub(o.s)),p=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},k,ub(o.d));S=JSON.parse(new TextDecoder().decode(p));CK={k:k,s:o.s}}
 else{if(pw!=g('pw2').value){er.textContent=`Passwords don't match`;return}var s=crypto.getRandomValues(new Uint8Array(16));CK={k:await derive(pw,s),s:b64(s)};S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}}
 norm();LOCKED=false;save();R()}catch(x){er.textContent=raw?'Wrong password':'Could not set up encryption in this browser'}}
function lockNow(){S=null;CK=null;LOCKED=true;R()}
async function changePw(){var p=document.getElementById('np1').value;if(p.length<4)return alert('At least 4 characters');var s=crypto.getRandomValues(new Uint8Array(16));CK={k:await derive(p,s),s:b64(s)};save();alert('Password changed')}
function lockH(){var has=false,old=false;try{has=!!localStorage.getItem(ENC);old=!has&&!!localStorage.getItem(KEY)}catch(x){}return `<div class='card' style='max-width:380px;margin:12vh auto;text-align:center'><div style='font-size:56px'>🔐</div><h1>${has?'Welcome back':'Create your password'}</h1><div class=sub>${has?'Enter your password to open your life log.':(old?'Your existing log will be encrypted with this password.':'This password encrypts your data on this device. If you forget it, it cannot be recovered, so keep backups.')}</div><input id='pw' type='password' placeholder='Password' onkeydown='if(event.keyCode==13)unlock()'>${has?'':`<input id='pw2' type='password' placeholder='Repeat password' onkeydown='if(event.keyCode==13)unlock()'>`}<div id='lerr' class='r' style='min-height:22px'></div><button class='pri' onclick='unlock()'>${has?'Unlock':'Create & open'}</button></div>`}
var F={when:loc(now()),act:'Eating',sub:'',desc:'',people:[],sign:0,amt:'',shop:'',place:''},P={per:'month',date:loc(now()).slice(0,10)};
var esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var money=n=>(n<0?'−':n>0?'+':'')+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2})+' '+S.cur;
var cls=n=>n>0?'g':n<0?'r':'m';
function R(){if(LOCKED){$nav.innerHTML='';$app.innerHTML=lockH();return}
 var tabs=[['home','🏠','Home'],['log','✍️','Log'],['fin','💰','Finance'],['ppl','👥','People'],['plan','📅','Plan'],['me','⚙️','Me']];
 $nav.innerHTML=tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';R()"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $app.innerHTML=({home:vHome,log:vLog,fin:vFin,ppl:vPpl,plan:vPlan,me:vMe})[tab]();
}
var $nav=document.getElementById('nav'),$app=document.getElementById('app');
function banner(x){if(tab=='home'&&!x)return '';var l=S.entries.reduce((m,e)=>Math.max(m,e.t),0),h=(Date.now()-l)/36e5;
 return !l?'<div class="ban">Welcome! Log your first activity below.</div>':h>=2?`<div class="ban">⏰ Last entry was ${Math.floor(h)}h ago. What have you been up to?</div>`:''}
var m0=n=>Math.round(n).toLocaleString()+' '+S.cur,iso=d=>loc(d).slice(0,10);
function occ(s,rep,h){var o=[],d=new Date(s+'T00:00'),t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());for(var i=0;i<60&&d<=h;i++){o.push(d<t0?new Date(t0):new Date(d));if(rep!='monthly')break;d.setMonth(d.getMonth()+1)}return o}
function vHome(){var h=now().getHours(),g=h<12?'Good morning ☀️':h<18?'Good afternoon 🌤️':'Good evening 🌙';return `<h1>${g}</h1><div class=sub>Here's your little life world 🌈</div>`+banner(1)+homeInfo()+'<h1 style="font-size:22px;margin-top:18px">💰 Money snapshot</h1>'+vHomeFin()}
function vHomeFin(){
 var bal=S.opening+S.entries.reduce((s,e)=>s+e.amt,0),debt=S.loans.reduce((s,l)=>s+Math.max(0,l.amt-l.paid),0),t=new Date(),h=new Date(t.getFullYear(),t.getMonth(),t.getDate()+HZ),ev=[];
 S.upcoming.forEach(u=>u.date&&occ(u.date,u.rep,h).forEach(d=>ev.push({d,n:u.n,a:u.kind=='in'?u.amt:-u.amt})));
 S.loans.forEach(l=>{var out=l.amt-l.paid;if(out<=0||!l.next)return;if(l.mo>0){var rem=out;occ(l.next,'monthly',h).forEach(d=>{var a=Math.min(l.mo,rem);rem-=a;if(a>0)ev.push({d,n:l.n+' installment',a:-a})})}else occ(l.next,'once',h).forEach(d=>ev.push({d,n:l.n+' due',a:-out}))});
 ev.sort((a,b)=>a.d-b.d);var run=bal,min=bal,md=null,inn=0,out=0;ev.forEach(e=>{run+=e.a;e.r=run;e.a>0?inn+=e.a:out-=e.a;if(run<min){min=run;md=e.d}});
 var ok=min>=0;
 return `<div class="hero"><div class="sub">Account balance</div><div class="big">${m0(bal)}</div><div class="sub">${esc(S.profile.position||'')}${S.profile.company?' · '+esc(S.profile.company):''}</div>
 <div class="grid" style="margin-top:14px"><div><small>Debt</small><b>${m0(debt)}</b></div><div><small>Net position</small><b>${m0(bal-debt)}</b></div><div><small>Out in ${HZ}d</small><b>${m0(out)}</b></div></div></div>
 ${banner()}
 <div class="card ${ok?'ok':'bad'}"><h3>${ok?'✅ Funds look adequate':'⚠️ Shortfall expected'}</h3>
 <div class="chips">${[30,60,90].map(n=>`<span class="chip ${HZ==n?'on':''}" onclick="HZ=${n};R()">Next ${n} days</span>`).join('')}</div>
 <div>${ok?`After all payments and income you'd have <b>${m0(run)}</b>. Lowest point: <b>${m0(min)}</b>.`:`You'd be short by <b class="r">${m0(-min)}</b> around <b>${md.toLocaleDateString()}</b>. Expected income: ${m0(inn)}, payments: ${m0(out)}.`}</div></div>
 <div class="card"><h3>Coming up</h3>${ev.map(e=>`<div class="ev"><div class="d">${e.d.toLocaleDateString([],{day:'numeric',month:'short'})}</div><div class="l"><b>${esc(e.n)}</b><div class="sub">balance after: ${m0(e.r)}</div></div><div class="amt ${cls(e.a)}">${money(e.a)}</div></div>`).join('')||'<div class="m">Nothing scheduled. Add payments or salary below.</div>'}</div>
 <div class="card"><h3>Loans & debts</h3>${S.loans.map((l,i)=>{var o=Math.max(0,l.amt-l.paid),ml=l.mo>0?Math.ceil(o/l.mo):0;return `<div class="ev" style="display:block"><div class="row"><b>${esc(l.n)}${l.who?' · '+esc(l.who):''}</b><span class="amt r" style="text-align:right">${m0(o)} left</span></div><div class="bar"><i style="width:${Math.min(100,l.paid/l.amt*100)}%"></i></div><div class="sub">of ${m0(l.amt)}${l.mo?' · '+m0(l.mo)+'/mo · '+ml+' months left':''}${l.next?' · next '+l.next:''}</div><button onclick="payLoan(${i})">Mark installment paid</button> <button class="x" onclick="S.loans.splice(${i},1);save();R()">Delete</button></div>`}).join('')||'<div class="m">No loans.</div>'}
 <h3 style="margin-top:14px">Add loan</h3><div class="row"><input id="ln" placeholder="Name (e.g. Car loan)"><input id="lw" placeholder="Lender (e.g. friend)"></div><div class="row"><input id="la" type="number" placeholder="Total amount"><input id="lp" type="number" placeholder="Already paid"></div><div class="row"><input id="lm" type="number" placeholder="Period (months)"><input id="lx" type="date"></div><div class="sub">Last field: next due date. Leave period empty for a single lump-sum repayment.</div><button class="pri" onclick="addLoan()">Save loan</button></div>

function addUp(){var g=i=>document.getElementById(i).value,n=g('un').trim(),a=+g('ua');if(!n||!a||!g('ud'))return alert('Name, amount and date needed');S.upcoming.push({n,amt:a,date:g('ud'),kind:g('uk'),rep:g('ur')});save();R()}
function nextM(s){var d=new Date(s+'T00:00');d.setMonth(d.getMonth()+1);return iso(d)}

 return `<div class='card'><h3>🕒 Recently added</h3>${td.slice(0,4).map(e=>`<div class='ev'><div class='d'>${new Date(e.t).toLocaleDateString([],{day:'numeric',month:'short'})}</div><div class='l'><b>${esc(e.act)}${e.sub?' › '+esc(e.sub):''}</b>${e.desc?'<div class=sub>'+esc(e.desc)+'</div>':''}</div></div>`).join('')||'<div class=m>Nothing logged today yet.</div>'}<button class='pri' onclick='goLog()'>+ Log something</button></div>`+
 `<div class='card'><h3>⏰ Reminders & journeys</h3>${rm.map(r=>`<div class='ev'><div class='l'><b>${r.kind=='Journey'?'✈️':'⏰'} ${esc(r.n)}</b><div class='sub ${r.when<=loc(now())?'r':''}'>${r.when.replace('T',' ')}${r.when<=loc(now())?' · due':''}</div></div><button onclick='remDone(${r.id})'>Done</button></div>`).join('')||'<div class=m>No reminders. Add them in Plan.</div>'}</div>`+

 (dy.length?`<div class='card'><h3>🎉 Special days</h3>${dy.map(d=>`<div class='ev'><div class='l'><b>${esc(d.n)}</b>${d.who?'<div class=sub>'+esc(d.who)+'</div>':''}</div><div class='amt'>${d.l==0?'Today 🎉':d.l+' days'}</div></div>`).join('')}</div>`:'')+
 (S.plans.length?`<div class='card'><h3>🎯 Future plans</h3><div class=sub>Net effect if all happen: <b class='${cls(pn)}'>${money(pn)}</b> → balance would be <b>${m0(bl+pn)}</b></div></div>`:'')}

function genRep(){var Q=String.fromCharCode(34),g=i=>document.getElementById(i).value,a=g('r1')?new Date(g('r1')+'T00:00').getTime():0,b=g('r2')?new Date(g('r2')+'T00:00').getTime()+864e5:9e15,k=g('ra'),q=s=>{s=String(s||'');return Q+s.split(Q).join(Q+Q)+Q},L=S.entries.filter(e=>e.t>=a&&e.t<b&&(k=='All'||e.act==k)).sort((x,y)=>x.t-y.t);document.getElementById('ro').value=['Date,Time,Activity,Sub,Description,People,Shop,Place,Amount,SleepHours'].concat(L.map(e=>{var d=new Date(e.t);return [iso(d),d.toTimeString().slice(0,5),q(e.act),q(e.sub),q(e.desc),q((e.people||[]).join('; ')),q(e.shop),q(e.place),e.amt,e.dur||''].join(',')})).join(String.fromCharCode(10))}

 return `<h1>📖 Life Log</h1><div class="sub">Your past, in your own words.</div>${banner()}

 ${Object.keys(byDay).map(d=>`<div class="day">${d}</div><div class="card" style="margin-top:6px">${byDay[d].map(e=>`<div class="ev"><div class="m" style="width:46px">${new Date(e.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="l"><b>${esc(e.act)}${e.sub?' › '+esc(e.sub):''}</b>${e.desc?'<div>'+esc(e.desc)+'</div>':''}${e.people.length?'<div class="sub">with '+e.people.map(esc).join(', ')+'</div>':''}${e.shop||e.place?'<div class="sub">📍 '+esc([e.shop,e.place].filter(Boolean).join(', '))+'</div>':''}</div>${e.amt?`<div class="amt ${cls(e.amt)}">${money(e.amt)}</div>`:''}<button class="x" onclick="del(${e.id})">✕</button></div>`).join('')}</div>`).join('')}`;

 <div class="card"><h3>2-hour reminder</h3><div class="sub">Shows a banner in Log after 2 hours without an entry. Browser alerts only work while this page is open.</div><button class="pri" onclick="Notification.requestPermission().then(()=>alert('Done'))">Enable notifications</button></div>
 <div class='card'><h3>🔐 Security</h3><div class=sub>Your data is encrypted with your password on this device. It locks itself after 5 minutes away. Note: the Backup text below is not encrypted, so store it safely.</div><button class='pri' onclick='lockNow()'>Lock now</button><input id='np1' type='password' placeholder='New password'><button onclick='changePw()'>Change password</button></div><div class='card'><h3>Activity report</h3><div class='sub'>Export any period or activity as CSV (opens in Excel or Sheets).</div><div class='row'><input id='r1' type='date' value='${iso(new Date(new Date().getFullYear(),new Date().getMonth(),1))}'><input id='r2' type='date' value='${iso(now())}'></div><select id='ra'><option>All</option>${Object.keys(S.acts).map(a=>`<option>${esc(a)}</option>`).join('')}</select><button class='pri' onclick='genRep()'>Generate</button><textarea id='ro' rows='6'></textarea><button onclick='copyOut()'>Copy CSV</button></div><div class="card"><h3>Backup</h3><div class="sub">Data lives only in this browser. Export regularly.</div><button class="pri" onclick="exp()">Copy all data (JSON)</button><textarea id="imp" rows="2" placeholder="Paste JSON here to restore"></textarea><button class="pri" onclick="try{S=JSON.parse(document.getElementById('imp').value);norm();save();tab='log';R()}catch(e){alert('Invalid JSON')}">Restore</button></div>`}
function exp(){var t=JSON.stringify(S);try{navigator.clipboard.writeText(t);alert('Copied to clipboard')}catch(e){prompt('Copy:',t)}}
document.addEventListener('visibilitychange',function(){if(document.hidden)window._h=Date.now();else if(!LOCKED&&Date.now()-(window._h||0)>3e5)lockNow()});setInterval(function(){if(LOCKED)return;S.rem.forEach(function(r){if(!r.done&&!r.nt&&r.when<=loc(now())){r.nt=1;save();try{if(Notification.permission=='granted')new Notification('Reminder',{body:r.n})}catch(e){}}});var l=S.entries.reduce((m,e)=>Math.max(m,e.t),0);if(l&&Date.now()-l>72e5){try{if(Notification.permission=='granted'&&Date.now()-(window._n||0)>72e5){window._n=Date.now();new Notification('Life Log',{body:'What have you done in the last 2 hours?'})}}catch(e){}if(tab=='log'&&!document.activeElement.matches('input,textarea'))R()}},6e4);
R();
</script></body></html>
